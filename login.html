<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Empire FGA</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#090D12;--bg1:#0D1520;--bg2:#111C2A;--bg3:#172234;--bg4:#1C2A3E;
    --gold:#C9921A;--gold2:#EDB84E;--goldlo:rgba(201,146,26,.1);
    --cyan:#2DD4BF;--cyanlo:rgba(45,212,191,.1);--cyandim:rgba(45,212,191,.3);
    --red:#F04545;--grn:#22D46A;
    --t1:#F0F6FF;--t2:#8BA5C0;--t3:#44627A;
    --ln:rgba(255,255,255,.06);--ln2:rgba(255,255,255,.11);
    --D:'Inter',sans-serif;--M:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:var(--D);background:
      radial-gradient(1200px 600px at 15% -10%, rgba(201,146,26,.08), transparent 60%),
      radial-gradient(1000px 500px at 100% 110%, rgba(45,212,191,.06), transparent 55%),
      var(--bg);
    color:var(--t1);min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;max-width:400px;background:linear-gradient(180deg,var(--bg2),var(--bg1));
    border:1px solid var(--ln2);border-radius:16px;padding:40px 36px 34px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .logo-wrap{display:flex;justify-content:center;margin-bottom:22px;}
  .logo-wrap img{height:64px;width:auto;}
  h1{font-size:1.15rem;font-weight:800;text-align:center;letter-spacing:.02em;color:var(--t1);}
  .sub{text-align:center;color:var(--t2);font-size:.78rem;margin-top:6px;margin-bottom:28px;letter-spacing:.03em;}
  label{display:block;font-size:.68rem;font-weight:600;color:var(--t2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
  .field{margin-bottom:18px;}
  input{
    width:100%;background:var(--bg3);border:1px solid var(--ln2);border-radius:9px;
    padding:12px 14px;color:var(--t1);font-family:var(--D);font-size:.92rem;outline:none;
    transition:border-color .15s;
  }
  input:focus{border-color:var(--gold);}
  button{
    width:100%;margin-top:8px;padding:13px;border:none;border-radius:9px;
    background:linear-gradient(135deg,var(--gold2),var(--gold));
    color:#1A1200;font-weight:800;font-size:.85rem;letter-spacing:.03em;cursor:pointer;
    transition:filter .15s, transform .15s;
  }
  button:hover{filter:brightness(1.08);}
  button:active{transform:scale(.98);}
  .err{
    display:none;margin-top:14px;padding:10px 12px;border-radius:8px;
    background:rgba(240,69,69,.1);border:1px solid rgba(240,69,69,.3);
    color:#FF8080;font-size:.78rem;text-align:center;
  }
  .err.show{display:block;}
  .foot{margin-top:26px;text-align:center;font-size:.66rem;color:var(--t3);font-family:var(--M);letter-spacing:.02em;}
</style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="off">
    <div class="logo-wrap"><img src="esn-logo.png" alt="Empire Scouting Network"></div>
    <h1>EMPIRE FGA</h1>
    <div class="sub">Field Global Analysis &middot; Private Access</div>

    <div class="field">
      <label for="u">Username</label>
      <input id="u" name="u" type="text" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="p">Password</label>
      <input id="p" name="p" type="password" autocomplete="current-password" required>
    </div>

    <button type="submit">Sign In</button>
    <div class="err" id="err">Incorrect username or password.</div>
    <div class="foot">EMPIRE SCOUTING NETWORK &middot; 779 METRICS &middot; 60 PHILOSOPHIES</div>
  </form>

<script>
(function(){
  var SALT = 'ESN-FGA-2026';
  var USER_HASH = '69c9d06146efd905b8d918551e5d00846c56cf64effb6e8d9fd4d3953deae984';
  var PASS_HASH = '5a6afeefae9b32c6ad11a6ebc70e9c360a010cb7844f14bfa7eb2e4c919f1298';
  var REDIRECT = 'platform.html';

  async function sha256(msg){
    var enc = new TextEncoder().encode(msg);
    var buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }

  document.getElementById('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var u = document.getElementById('u').value.trim();
    var p = document.getElementById('p').value;
    var uh = await sha256(SALT + u);
    var ph = await sha256(SALT + p);
    var err = document.getElementById('err');
    if(uh === USER_HASH && ph === PASS_HASH){
      sessionStorage.setItem('esn_fga_auth', '1');
      sessionStorage.setItem('esn_fga_user', u);
      window.location.replace(REDIRECT);
    } else {
      err.classList.add('show');
    }
  });
})();
</script>
</body>
</html>
