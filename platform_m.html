<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function(){
  try{
    if(localStorage.getItem('esn_fga_auth') !== '1'){
      window.location.replace('login.html');
    }
  }catch(e){
    window.location.replace('login.html');
  }
})();
</script>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>Empire FGA | Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#090D12;--bg1:#0D1520;--bg2:#111C2A;--bg3:#152544;--bg4:#1C2A3E;
  --gold:#C9921A;--gold2:#EDB84E;--goldlo:rgba(201,146,26,.1);
  --cyan:#2DD4BF;--cyanlo:rgba(45,212,191,.1);
  --red:#F04545;--grn:#22D46A;
  --t1:#F0F6FF;--t2:#8BA5C0;--t3:#44627A;
  --ln:rgba(255,255,255,.07);--ln2:rgba(255,255,255,.12);
  --D:'Inter',sans-serif;--M:'JetBrains Mono',monospace;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--D);background:var(--bg);color:var(--t1);overflow-x:hidden;-webkit-font-smoothing:antialiased}
#app{min-height:100vh;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
#topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:calc(12px + var(--safe-top)) 14px 12px;background:rgba(9,13,18,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--ln)}
.tb-back{background:var(--bg3);border:1px solid var(--ln2);color:var(--t1);width:34px;height:34px;border-radius:9px;
  font-size:1.15rem;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tb-back:active{background:var(--bg4)}
.tb-title{flex:1;min-width:0}
.tb-title .tt-crumb{font-family:var(--M);font-size:.6rem;letter-spacing:.5px;color:var(--t3);text-transform:uppercase;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title .tt-main{font-size:1.02rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(135deg,#fff,var(--t2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.tb-search-btn{background:var(--bg3);border:1px solid var(--ln2);color:var(--gold2);width:34px;height:34px;border-radius:9px;
  font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tb-search-btn.on{background:var(--goldlo);border-color:rgba(201,146,26,.4)}

.searchbar{padding:10px 14px;background:var(--bg1);border-bottom:1px solid var(--ln)}
.searchbar input{width:100%;background:var(--bg3);border:1px solid var(--ln2);border-radius:10px;padding:11px 14px;
  color:var(--t1);font-family:var(--D);font-size:.92rem;outline:none}
.searchbar input:focus{border-color:var(--cyan)}
.searchbar input::placeholder{color:var(--t3)}

#view{flex:1;padding:14px 14px calc(24px + var(--safe-bottom))}

/* ---------- loading / empty ---------- */
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;z-index:100}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--bg3);border-top-color:var(--gold);
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-screen div.lbl{font-family:var(--M);font-size:.7rem;color:var(--t3);text-transform:uppercase;letter-spacing:1px}
.err-box{background:var(--bg2);border:1px solid rgba(240,69,69,.3);border-radius:10px;padding:18px;text-align:center;
  color:var(--t2);font-size:.85rem}
.err-box button{margin-top:12px;background:var(--goldlo);border:1px solid rgba(201,146,26,.4);color:var(--gold2);
  padding:9px 18px;border-radius:8px;font-family:var(--D);font-weight:600;font-size:.82rem}
.empty-msg{text-align:center;color:var(--t3);font-size:.85rem;padding:40px 20px;font-family:var(--M)}

/* ---------- stat strip ---------- */
.m-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-bottom:16px}
.m-stat{background:var(--bg3);border:1px solid rgba(78,130,200,.28);border-radius:10px;padding:13px 14px;
  position:relative;overflow:hidden}
.m-stat::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--gold),var(--cyan));opacity:.5}
.m-stat-val{font-family:var(--M);font-size:1.5rem;font-weight:700;color:var(--gold2);line-height:1}
.m-stat-lbl{font-family:var(--D);font-size:.62rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;
  color:var(--t3);margin-top:5px}

.sec-lbl{font-family:var(--D);font-size:.66rem;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--t3);margin:18px 2px 9px}
.sec-lbl:first-child{margin-top:0}

/* ---------- row list (continents / countries) ---------- */
.row-list{display:flex;flex-direction:column;gap:8px}
.m-row{background:var(--bg3);border:1px solid rgba(78,130,200,.22);border-radius:11px;padding:14px 15px;
  display:flex;align-items:center;gap:12px;transition:border-color .15s,background .15s}
.m-row:active{background:var(--bg4);border-color:rgba(78,130,200,.5)}
.m-row-flag{font-size:1.5rem;flex-shrink:0;width:32px;text-align:center;line-height:1}
.m-row-body{flex:1;min-width:0}
.m-row-name{font-size:.92rem;font-weight:700;color:var(--t1)}
.m-row-meta{font-family:var(--M);font-size:.68rem;color:var(--t3);margin-top:2px}
.m-row-meta strong{color:var(--gold2)}
.m-row-chev{color:var(--t3);font-size:1.1rem;flex-shrink:0}

/* ---------- league cards ---------- */
.league-list{display:flex;flex-direction:column;gap:10px}
.m-league{background:var(--bg3);border:1px solid rgba(78,130,200,.22);border-radius:11px;padding:14px 15px}
.m-league:active{border-color:var(--cyan)}
.m-league-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.m-league-name{font-size:.94rem;font-weight:700;color:var(--t1)}
.m-league-total{font-family:var(--M);font-size:1.05rem;font-weight:700;color:var(--gold2)}
.m-season-pills{display:flex;flex-wrap:wrap;gap:6px}
.m-season-pill{font-family:var(--M);font-size:.62rem;color:var(--t2);background:rgba(255,255,255,.05);
  border:1px solid rgba(78,130,200,.2);border-radius:5px;padding:3px 8px}
.m-league-btn{margin-top:11px;width:100%;background:var(--goldlo);border:1px solid rgba(201,146,26,.35);
  color:var(--gold2);font-family:var(--D);font-weight:700;font-size:.78rem;letter-spacing:.4px;
  padding:9px;border-radius:8px;text-transform:uppercase}
.m-league-btn:active{background:rgba(201,146,26,.22)}

/* ---------- player list ---------- */
.plist{display:flex;flex-direction:column;gap:7px}
.p-row{background:var(--bg2);border:1px solid var(--ln2);border-radius:9px;padding:11px 13px;
  display:flex;align-items:center;gap:11px}
.p-row:active{background:var(--bg3)}
.p-ava{width:36px;height:36px;border-radius:50%;background:var(--bg4);border:1px solid rgba(78,130,200,.3);
  display:flex;align-items:center;justify-content:center;font-family:var(--D);font-weight:700;font-size:.8rem;
  color:var(--gold2);flex-shrink:0}
.p-info{flex:1;min-width:0}
.p-name{font-size:.86rem;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-meta{font-family:var(--M);font-size:.63rem;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-fga{font-family:var(--M);font-size:.78rem;font-weight:700;flex-shrink:0;text-align:right;min-width:34px}
.p-fga.pending{color:var(--t3);font-size:.58rem}
.load-more{width:100%;margin-top:12px;background:var(--bg3);border:1px solid var(--ln2);color:var(--t2);
  font-family:var(--D);font-weight:600;font-size:.8rem;padding:12px;border-radius:9px}
.load-more:active{background:var(--bg4)}
.results-note{font-family:var(--M);font-size:.65rem;color:var(--t3);text-align:center;margin-top:12px}

/* ---------- sheet (player detail) ---------- */
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-overlay.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--bg1);border-top:1px solid var(--ln2);
  border-radius:16px 16px 0 0;padding:10px 18px calc(22px + var(--safe-bottom));max-height:80vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.8,.3,1)}
.sheet.on{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--ln2);border-radius:3px;margin:0 auto 16px}
.sheet-name{font-size:1.3rem;font-weight:800;color:var(--t1);margin-bottom:4px}
.sheet-meta{font-family:var(--M);font-size:.75rem;color:var(--t2);margin-bottom:14px}
.sheet-tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.sheet-tag{font-family:var(--D);font-size:.68rem;font-weight:600;padding:5px 11px;border-radius:100px;
  background:var(--bg3);border:1px solid var(--ln2);color:var(--t2)}
.sheet-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.sheet-stat{background:var(--bg3);border:1px solid var(--ln2);border-radius:9px;padding:10px;text-align:center}
.sheet-stat-v{font-family:var(--M);font-size:1.15rem;font-weight:700;color:var(--gold2)}
.sheet-stat-l{font-family:var(--D);font-size:.58rem;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
.sheet-seasons{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.sheet-season-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg2);
  border:1px solid var(--ln);border-radius:7px;padding:8px 11px;font-family:var(--M);font-size:.68rem;color:var(--t2)}
.sheet-season-row strong{color:var(--t1)}
.sheet-link{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;
  background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:10px;color:#0a0e14;
  font-family:var(--D);font-weight:700;font-size:.86rem;text-decoration:none}
.sheet-link.disabled{background:var(--bg3);color:var(--t3);border:1px solid var(--ln2)}
.sheet-close{position:absolute;top:12px;right:14px;width:30px;height:30px;border-radius:50%;background:var(--bg3);
  border:1px solid var(--ln2);color:var(--t2);font-size:1rem;display:flex;align-items:center;justify-content:center}

@media (min-width:640px){
  #view{max-width:560px;margin:0 auto;width:100%}
  #topbar,.searchbar{padding-left:calc((100% - 560px)/2 + 14px);padding-right:calc((100% - 560px)/2 + 14px)}
  .sheet{max-width:560px;margin:0 auto;border-radius:16px 16px 0 0}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <button id="btn-back" class="tb-back" onclick="mGoBack()" hidden>&#8249;</button>
    <div class="tb-title" id="tb-title">
      <div class="tt-crumb" id="tt-crumb">Empire FGA</div>
      <div class="tt-main" id="tt-main">Scouting Intelligence</div>
    </div>
    <button id="btn-search-toggle" class="tb-search-btn" onclick="mToggleSearch()">&#128269;</button>
  </div>
  <div class="searchbar" id="searchbar" hidden>
    <input id="search-input" type="text" placeholder="Search players by name…" oninput="mOnSearchInput()" autocomplete="off" />
  </div>
  <main id="view"></main>
</div>
<div class="sheet-overlay" id="sheet-overlay" onclick="mCloseSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="loading-screen" id="loading">
  <div class="spinner"></div>
  <div class="lbl">Loading Empire FGA…</div>
</div>

<script>
'use strict';
var P = [];
var EXISTING_PROFILES = new Set();
var HD_MAP={"Andorra":"Europe","Argentina":"South America","Australia":"Oceania","Austria":"Europe","Belgium":"Europe","Bolivia":"South America","Brazil":"South America","Bulgaria":"Europe","Canada":"North America","Chile":"South America","Colombia":"South America","Croatia":"Europe","Czech Republic":"Europe","Denmark":"Europe","Ecuador":"South America","England":"Europe","France":"Europe","Germany":"Europe","Greece":"Europe","Hungary":"Europe","Iran":"Asia","Italy":"Europe","Japan":"Asia","Luxembourg":"Europe","Mexico":"North America","Netherlands":"Europe","Norway":"Europe","Paraguay":"South America","Peru":"South America","Poland":"Europe","Portugal":"Europe","Romania":"Europe","Saudi Arabia":"Asia","Scotland":"Europe","South Africa":"Africa","South Korea":"Asia","Spain":"Europe","Switzerland":"Europe","Turkey":"Europe","United States":"North America","Uruguay":"South America","Venezuela":"South America"};
var HD_LBL={total:"Total Players",leagues:"Leagues",countries:"Countries",continents:"Continents",players:"players",league1:"league",leagueN:"leagues"};
var HD_CNAMES={"Europe":"Europe","South America":"South America","North America":"North America","Asia":"Asia","Africa":"Africa","Oceania":"Oceania","Other":"Other"};
var DATA_SRC='platform.html';

var navStack=[{type:'home'}];
var loadCount={}; // per-league pagination cursor for player lists
var PAGE_SIZE=40;

function extractArrayLiteral(html, startMarker, findEq){
  var start = html.indexOf(startMarker);
  if(start<0) return null;
  var arrStart = findEq ? html.indexOf('[', html.indexOf('=', start)) : html.indexOf('[', start);
  var i=arrStart, depth=0, inStr=false, esc=false;
  while(i<html.length){
    var ch=html[i];
    if(inStr){
      if(esc){esc=false;}
      else if(ch==='\\'){esc=true;}
      else if(ch==='"'){inStr=false;}
    } else {
      if(ch==='"'){inStr=true;}
      else if(ch==='['){depth++;}
      else if(ch===']'){depth--; if(depth===0){i++; break;}}
    }
    i++;
  }
  return html.slice(arrStart, i);
}

function boot(){
  fetch(DATA_SRC, {cache:'force-cache'}).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(html){
    var pText = extractArrayLiteral(html, 'const P', true);
    if(!pText) throw new Error('player data block not found');
    // Note: the source array can contain bare NaN tokens (valid JS, not valid JSON),
    // so this is evaluated as JS rather than JSON.parse'd.
    P = (new Function('return ' + pText))();
    var profText = extractArrayLiteral(html, 'EXISTING_PROFILES=new Set(', false);
    if(profText){
      try{ EXISTING_PROFILES = new Set((new Function('return ' + profText))()); }catch(e){ EXISTING_PROFILES = new Set(); }
    }
    document.getElementById('loading').style.display='none';
    mRenderHome();
  }).catch(function(err){
    document.getElementById('loading').innerHTML =
      '<div class="err-box">Could not load player data.<br>'+(err&&err.message?err.message:'')+
      '<br><button onclick="location.reload()">Retry</button></div>';
  });
}

// ---------- data grouping ----------
function buildHierarchy(){
  var data={};
  P.forEach(function(p){
    var c=p.c||'Other', l=p.l||'Other', s=p.season||'\u2014', f=p.f||'';
    var cont=HD_MAP[c]||'Other';
    if(!data[cont])data[cont]={total:0,countries:{}};
    data[cont].total++;
    var cd=data[cont].countries;
    if(!cd[c])cd[c]={total:0,flag:f,leagues:{}};
    cd[c].total++;
    if(f)cd[c].flag=f;
    var ld=cd[c].leagues;
    if(!ld[l])ld[l]={total:0,seasons:{}};
    ld[l].total++;
    ld[l].seasons[s]=(ld[l].seasons[s]||0)+1;
  });
  return data;
}

// ---------- nav helpers ----------
function mPush(state){ navStack.push(state); mRender(); }
function mGoBack(){
  if(navStack.length>1){ navStack.pop(); mRender(); }
}
function mRender(){
  var st=navStack[navStack.length-1];
  document.getElementById('btn-back').hidden = navStack.length<=1;
  if(st.type==='home') mRenderHome(true);
  else if(st.type==='countries') mRenderCountries(st.cont,true);
  else if(st.type==='leagues') mRenderLeagues(st.cont,st.country,true);
  else if(st.type==='players') mRenderPlayers(st.cont,st.country,st.league,true);
  else if(st.type==='search') mRenderSearch(st.query,true);
}
function setTitle(crumb,main){
  document.getElementById('tt-crumb').textContent=crumb;
  document.getElementById('tt-main').textContent=main;
}

// ---------- views ----------
function mRenderHome(skipPush){
  if(!skipPush) navStack=[{type:'home'}];
  setTitle('Empire FGA','Scouting Intelligence');
  var data=buildHierarchy();
  var contKeys=Object.keys(data).sort(function(a,b){return data[b].total-data[a].total;});
  var totalLeagues=0, totalCountries=0;
  contKeys.forEach(function(k){
    var ck=Object.keys(data[k].countries);
    totalCountries+=ck.length;
    ck.forEach(function(cc){totalLeagues+=Object.keys(data[k].countries[cc].leagues).length;});
  });
  var html='<div class="m-stats">'+
    '<div class="m-stat"><div class="m-stat-val">'+P.length.toLocaleString()+'</div><div class="m-stat-lbl">'+HD_LBL.total+'</div></div>'+
    '<div class="m-stat"><div class="m-stat-val">'+totalLeagues+'</div><div class="m-stat-lbl">'+HD_LBL.leagues+'</div></div>'+
    '<div class="m-stat"><div class="m-stat-val">'+totalCountries+'</div><div class="m-stat-lbl">'+HD_LBL.countries+'</div></div>'+
    '<div class="m-stat"><div class="m-stat-val">'+contKeys.length+'</div><div class="m-stat-lbl">'+HD_LBL.continents+'</div></div>'+
  '</div>';
  html+='<div class="sec-lbl">Browse by Continent</div><div class="row-list">';
  html+=contKeys.map(function(k){
    var ck=Object.keys(data[k].countries);
    return '<div class="m-row" onclick="mPush({type:\'countries\',cont:\''+esc(k)+'\'})">'+
      '<div class="m-row-body"><div class="m-row-name">'+(HD_CNAMES[k]||k)+'</div>'+
      '<div class="m-row-meta">'+ck.length+' countries &middot; <strong>'+data[k].total.toLocaleString()+'</strong> players</div></div>'+
      '<div class="m-row-chev">&#8250;</div></div>';
  }).join('');
  html+='</div>';
  document.getElementById('view').innerHTML=html;
  window.scrollTo(0,0);
}

function mRenderCountries(cont,skipPush){
  if(!skipPush) mPush({type:'countries',cont:cont});
  setTitle('Continent',HD_CNAMES[cont]||cont);
  var data=buildHierarchy();
  var cd=(data[cont]||{countries:{}}).countries;
  var countryKeys=Object.keys(cd).sort(function(a,b){return cd[b].total-cd[a].total;});
  var html='<div class="sec-lbl">'+countryKeys.length+' Countries</div><div class="row-list">';
  html+=countryKeys.map(function(cname){
    var c=cd[cname];
    var lc=Object.keys(c.leagues).length;
    return '<div class="m-row" onclick="mPush({type:\'leagues\',cont:\''+esc(cont)+'\',country:\''+esc(cname)+'\'})">'+
      '<div class="m-row-flag">'+(c.flag||'')+'</div>'+
      '<div class="m-row-body"><div class="m-row-name">'+cname+'</div>'+
      '<div class="m-row-meta"><strong>'+c.total.toLocaleString()+'</strong> players &middot; '+lc+' league'+(lc>1?'s':'')+'</div></div>'+
      '<div class="m-row-chev">&#8250;</div></div>';
  }).join('');
  html+='</div>';
  document.getElementById('view').innerHTML=html;
  window.scrollTo(0,0);
}

function mRenderLeagues(cont,country,skipPush){
  if(!skipPush) mPush({type:'leagues',cont:cont,country:country});
  setTitle(HD_CNAMES[cont]||cont, country);
  var data=buildHierarchy();
  var cd=((data[cont]||{countries:{}}).countries[country])||{leagues:{}};
  var leagueKeys=Object.keys(cd.leagues).sort(function(a,b){return cd.leagues[b].total-cd.leagues[a].total;});
  var html='<div class="sec-lbl">'+leagueKeys.length+' League'+(leagueKeys.length>1?'s':'')+'</div><div class="league-list">';
  html+=leagueKeys.map(function(lname){
    var lg=cd.leagues[lname];
    var seasonKeys=Object.keys(lg.seasons).sort(function(a,b){return lg.seasons[b]-lg.seasons[a];});
    var pills=seasonKeys.map(function(s){return '<span class="m-season-pill">'+s+' &middot; '+lg.seasons[s]+'</span>';}).join('');
    return '<div class="m-league">'+
      '<div class="m-league-top"><span class="m-league-name">'+lname+'</span><span class="m-league-total">'+lg.total+'</span></div>'+
      '<div class="m-season-pills">'+pills+'</div>'+
      '<button class="m-league-btn" onclick="mPush({type:\'players\',cont:\''+esc(cont)+'\',country:\''+esc(country)+'\',league:\''+esc(lname)+'\'})">View '+lg.total+' Players</button>'+
    '</div>';
  }).join('');
  html+='</div>';
  document.getElementById('view').innerHTML=html;
  window.scrollTo(0,0);
}

function mRenderPlayers(cont,country,league,skipPush){
  if(!skipPush){ mPush({type:'players',cont:cont,country:country,league:league}); }
  setTitle(country, league);
  var key=cont+'|'+country+'|'+league;
  if(!(key in loadCount)) loadCount[key]=PAGE_SIZE;
  var list=P.filter(function(p){return p.c===country && p.l===league;})
    .sort(function(a,b){ return (a.n||'').localeCompare(b.n||''); });
  renderPlayerList(list, loadCount[key], function(){ loadCount[key]+=PAGE_SIZE; mRenderPlayers(cont,country,league,true); });
}

function mRenderSearch(query,skipPush){
  if(!skipPush) mPush({type:'search',query:query});
  setTitle('Search', query? '"'+query+'"' : 'Players');
  if(!query){ document.getElementById('view').innerHTML='<div class="empty-msg">Type a player name above to search.</div>'; return; }
  var q=query.toLowerCase();
  var list=P.filter(function(p){return (p.n||'').toLowerCase().indexOf(q)>=0;})
    .sort(function(a,b){ return (a.n||'').localeCompare(b.n||''); });
  var key='search|'+query;
  if(!(key in loadCount)) loadCount[key]=PAGE_SIZE;
  renderPlayerList(list, loadCount[key], function(){ loadCount[key]+=PAGE_SIZE; mRenderSearch(query,true); }, true);
}

function renderPlayerList(list, count, onLoadMore, showLeagueTag){
  var view=document.getElementById('view');
  if(list.length===0){ view.innerHTML='<div class="empty-msg">No players found.</div>'; return; }
  var slice=list.slice(0,count);
  var html='<div class="plist">';
  html+=slice.map(function(p){
    var initials=(p.n||'?').trim().split(/\s+/).map(function(x){return x[0];}).slice(0,2).join('').toUpperCase();
    var fga=p.fga;
    var fgaHtml=(fga===null||fga===undefined)?'<div class="p-fga pending">PENDING</div>':'<div class="p-fga">'+Math.round(fga)+'</div>';
    var metaLine=(p.pos||'')+' &middot; '+(p.sq||'\u2014')+(showLeagueTag?' &middot; '+(p.l||''):'')+(p.season?' &middot; '+p.season:'');
    var k=(p.pid+'|'+(p.season||'')+'|'+(p.sq||'')).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    return '<div class="p-row" onclick="mOpenSheet(\''+esc(p.pid)+'\',\''+esc(p.season||'')+'\',\''+esc((p.sq||'').replace(/'/g,"\\'"))+'\')">'+
      '<div class="p-ava">'+initials+'</div>'+
      '<div class="p-info"><div class="p-name">'+p.n+'</div><div class="p-meta">'+metaLine+'</div></div>'+
      fgaHtml+
    '</div>';
  }).join('');
  html+='</div>';
  if(list.length>count){
    html+='<button class="load-more" id="load-more-btn">Load '+Math.min(PAGE_SIZE,list.length-count)+' More (of '+list.length.toLocaleString()+')</button>';
  } else {
    html+='<div class="results-note">'+list.length.toLocaleString()+' player'+(list.length>1?'s':'')+'</div>';
  }
  view.innerHTML=html;
  var btn=document.getElementById('load-more-btn');
  if(btn) btn.onclick=onLoadMore;
  window.scrollTo(0,0);
}

// ---------- search bar toggle ----------
function mToggleSearch(){
  var bar=document.getElementById('searchbar');
  var btn=document.getElementById('btn-search-toggle');
  var willShow=bar.hidden;
  bar.hidden=!willShow;
  btn.classList.toggle('on',willShow);
  if(willShow){ document.getElementById('search-input').focus(); }
  else {
    document.getElementById('search-input').value='';
    if(navStack[navStack.length-1].type==='search'){ mGoBack(); }
  }
}
var searchDebounce=null;
function mOnSearchInput(){
  var q=document.getElementById('search-input').value.trim();
  clearTimeout(searchDebounce);
  searchDebounce=setTimeout(function(){
    if(navStack[navStack.length-1].type==='search'){ navStack[navStack.length-1]={type:'search',query:q}; }
    else { navStack.push({type:'search',query:q}); }
    document.getElementById('btn-back').hidden=false;
    mRenderSearch(q,true);
  },180);
}

// ---------- player detail sheet ----------
function mOpenSheet(pid,season,squad){
  var p=P.find(function(x){return x.pid===pid&&x.season===season&&x.sq===squad;});
  if(!p)p=P.find(function(x){return x.pid===pid&&x.season===season;});
  if(!p)p=P.find(function(x){return x.pid===pid;});
  if(!p)return;
  var profileFile=(p.n||'').trim().replace(/\s+/g,'_')+'.html';
  var hasProfile=EXISTING_PROFILES.has(profileFile);
  var allSeasons=P.filter(function(x){return x.pid===pid;})
    .sort(function(a,b){return (b.season||'').localeCompare(a.season||'');});
  var fga=p.fga;
  var html='<div class="sheet-close" onclick="mCloseSheet()">&#10005;</div>'+
    '<div class="sheet-handle"></div>'+
    '<div class="sheet-name">'+p.n+'</div>'+
    '<div class="sheet-meta">'+(p.nat||'')+' &middot; '+(p.age||'\u2014')+' yrs &middot; '+(p.pos||'\u2014')+'</div>'+
    '<div class="sheet-tags">'+
      '<span class="sheet-tag">'+(p.f||'')+' '+(p.l||'\u2014')+'</span>'+
      '<span class="sheet-tag">'+(p.sq||'\u2014')+'</span>'+
      '<span class="sheet-tag">'+(p.season||'\u2014')+'</span>'+
    '</div>'+
    '<div class="sheet-stats">'+
      '<div class="sheet-stat"><div class="sheet-stat-v">'+(p.mp!=null?p.mp:'\u2014')+'</div><div class="sheet-stat-l">Matches</div></div>'+
      '<div class="sheet-stat"><div class="sheet-stat-v">'+(p.g!=null?p.g:'\u2014')+'</div><div class="sheet-stat-l">Goals</div></div>'+
      '<div class="sheet-stat"><div class="sheet-stat-v">'+(fga==null?'\u2014':Math.round(fga))+'</div><div class="sheet-stat-l">FGA Score</div></div>'+
    '</div>'+
    (allSeasons.length>1 ?
      '<div class="sec-lbl" style="margin-top:0">All Seasons on File</div><div class="sheet-seasons">'+
        allSeasons.map(function(s){
          return '<div class="sheet-season-row"><span>'+(s.season||'\u2014')+' &middot; '+(s.sq||'\u2014')+'</span><strong>'+(s.l||'')+'</strong></div>';
        }).join('')+
      '</div>' : '')+
    (hasProfile
      ? '<a class="sheet-link" href="'+profileFile+'" target="_blank" rel="noopener">View Full Profile &#8250;</a>'
      : '<div class="sheet-link disabled">Profile Coming Soon</div>');
  document.getElementById('sheet').innerHTML=html;
  document.getElementById('sheet').classList.add('on');
  document.getElementById('sheet-overlay').classList.add('on');
}
function mCloseSheet(){
  document.getElementById('sheet').classList.remove('on');
  document.getElementById('sheet-overlay').classList.remove('on');
}

function esc(s){ return String(s).replace(/'/g,"\\'"); }

boot();
</script>
